[package]
name = "pki-playground"
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
camino = { version = "1.2.3" }
clap = { version = "4.6.1", features = ["derive"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.1", features = ["std"] }
digest = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["pem", "rand_core", "zeroize"] }
flagset = "0.4.7"
hex = "0.4.3"
ipnet = "2.12.0"
knus = "3.4.0"
miette = { version = "7.6.0", features = ["fancy"] }
p384 = { version = "0.14.0", features = ["ecdsa", "getrandom"] }
pem-rfc7468 = "0.7"
pkcs8 = { version = "0.11.0", features = ["pem"] }
rand = "0.10.2"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.0", features = ["oid"] }
sha3 = { version = "0.12.0", features = ["oid"] }
signature = "3.0.0"
spki = "0.8.0"
x509-cert = { version = "0.3.0", features = ["hazmat"] }
zeroize = "1.9.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
